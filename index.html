<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Deadline 提醒</title>
<meta name="description" content="輸入標題、說明和截止時間，Google 日曆和電腦會照你設的時間提醒你。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>try { var t = localStorage.getItem('dr.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="stylesheet" href="app.css?v=5">
</head>
<body>
<div id="app">
  <div class="pg" id="pm">
    <div id="list" class="list"><div class="empty">載入中…</div></div>
    <div class="cp" id="cp" role="button" tabindex="0" aria-label="新增">
      <span class="cpt">新增 Deadline：標題</span>
      <span class="send"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M3 20.5 21 12 3 3.5l.01 6.6L15 12 3.01 13.9z"/></svg></span>
    </div>
  </div>
  <div class="pg" id="pd">
    <div class="opts">
      <div class="og">外觀</div>
      <div class="seg" id="theme" role="radiogroup" aria-label="外觀">
        <button type="button" role="radio" data-v="">自動</button><button type="button" role="radio" data-v="light">淺色</button><button type="button" role="radio" data-v="dark">深色</button>
      </div>
      <div class="og">新項目的預設提醒</div>
      <div class="row">
        <span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3H4a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6M9.5 17v1a2.5 2.5 0 0 0 5 0v-1"/></svg>提前</span>
        <input id="da" class="v" type="text" inputmode="decimal" autocomplete="off" aria-label="預設提前多久開始提醒">
        <button type="button" class="u" id="dua" aria-label="切換單位">小時</button>
        <span class="sf">開始提醒</span>
      </div>
      <div class="row">
        <span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12V9.5a3 3 0 0 1 3-3h12.5M16.5 3.5l3 3-3 3M20 12v2.5a3 3 0 0 1-3 3H4.5M7.5 20.5l-3-3 3-3"/></svg>每隔</span>
        <input id="de" class="v" type="text" inputmode="decimal" autocomplete="off" aria-label="預設每隔多久提醒一次">
        <button type="button" class="u" id="due" aria-label="切換單位">小時</button>
        <span class="sf">提醒一次</span>
      </div>
      <div class="sync" id="syncInfo"></div>
    </div>
    <div id="dl" class="list"></div>
  </div>
  <div class="pill" id="pill" role="status"></div>

  <div class="bd" id="bd"></div>
  <div class="sh" id="sh" role="dialog" aria-modal="true" aria-label="編輯">
    <div id="shtop">
    <div class="gz" id="gz"><div class="grab"></div></div>
    <div class="top">
      <div class="fields">
        <input id="ft" type="text" placeholder="標題" maxlength="200" autocomplete="off" enterkeyhint="next">
        <textarea id="fnote" placeholder="說明" rows="1" maxlength="2000"></textarea>
      </div>
      <button type="button" id="ok" class="send off" aria-label="儲存">
        <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M3 20.5 21 12 3 3.5l.01 6.6L15 12 3.01 13.9z"/></svg>
        <svg class="i-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
    </div>
    <div class="hr"></div>
    </div>
    <label class="row dt">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v13.5H4zM4 10.5h16M8.5 3.5v4M15.5 3.5v4"/></svg>
      <span id="fdv" class="dv">選擇日期和時間</span><span class="sf2">截止</span>
      <input id="fd" type="datetime-local" aria-label="截止日期和時間">
    </label>
    <div class="row">
      <span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3H4a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6M9.5 17v1a2.5 2.5 0 0 0 5 0v-1"/></svg>提前</span>
      <input id="fa" class="v" type="text" inputmode="decimal" autocomplete="off" aria-label="提前多久開始提醒">
      <button type="button" class="u" id="ua" aria-label="切換單位">小時</button>
      <span class="sf">開始提醒</span>
    </div>
    <div class="row">
      <span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12V9.5a3 3 0 0 1 3-3h12.5M16.5 3.5l3 3-3 3M20 12v2.5a3 3 0 0 1-3 3H4.5M7.5 20.5l-3-3 3-3"/></svg>每隔</span>
      <input id="fe" class="v" type="text" inputmode="decimal" autocomplete="off" aria-label="每隔多久提醒一次">
      <button type="button" class="u" id="ue" aria-label="切換單位">小時</button>
      <span class="sf">提醒一次</span>
    </div>
  </div>

  <div class="tr" id="tr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2l1-12M9 7V4.5h6V7"/></svg></div>
  <div class="toast" id="toast"><span id="tmsg"></span><button type="button" id="undo">復原</button></div>
</div>
<script src="app.js?v=5"></script>
</body>
</html>
