<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8dff"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="shine" cx=".25" cy=".15" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb23e"/>
      <stop offset="1" stop-color="#f26b1d"/>
    </linearGradient>
  </defs><rect width="512" height="512" rx="116" fill="url(#bg)"/><rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <g transform="translate(-15 -22)">
    <!-- calendar shadow -->
    <rect x="104" y="140" width="244" height="236" rx="44" fill="#0b2a7a" opacity=".22"/>
    <!-- calendar body -->
    <rect x="104" y="132" width="244" height="236" rx="44" fill="#ffffff"/>
    <!-- header band -->
    <path d="M148 132h156a44 44 0 0 1 44 44v28H104v-28a44 44 0 0 1 44-44z" fill="#dbe6ff"/>
    <!-- binder rings -->
    <rect x="152" y="106" width="28" height="58" rx="14" fill="#1e3a8a"/>
    <rect x="272" y="106" width="28" height="58" rx="14" fill="#1e3a8a"/>
    <!-- date cells -->
    <g fill="#c7d6fb">
      <rect x="136" y="232" width="34" height="34" rx="9"/>
      <rect x="190" y="232" width="34" height="34" rx="9"/>
      <rect x="244" y="232" width="34" height="34" rx="9"/>
      <rect x="136" y="292" width="34" height="34" rx="9"/>
    </g>
    <!-- alarm clock -->
    <circle cx="330" cy="342" r="108" fill="#0b2a7a" opacity=".22"/>
    <circle cx="330" cy="334" r="108" fill="#ffffff"/>
    <circle cx="330" cy="334" r="90" fill="url(#clock)"/>
    <g stroke="#ffffff" stroke-linecap="round">
      <line x1="330" y1="262" x2="330" y2="276" stroke-width="10"/>
      <line x1="402" y1="334" x2="388" y2="334" stroke-width="10"/>
      <line x1="330" y1="406" x2="330" y2="392" stroke-width="10"/>
      <line x1="258" y1="334" x2="272" y2="334" stroke-width="10"/>
      <line x1="330" y1="334" x2="330" y2="283" stroke-width="15"/>
      <line x1="330" y1="334" x2="297" y2="314" stroke-width="15"/>
    </g>
    <circle cx="330" cy="334" r="11" fill="#ffffff"/>
  </g></svg>